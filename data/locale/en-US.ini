SourceName="Low Latency RTSP"
Info="Low-latency RTSP source with automatic H.264/H.265 video detection and optional audio."
URL="RTSP URL"
URLHelp="Paste an RTSP URL from a camera, NVR, or other RTSP server. Example: rtsp://host:554/path. The URL is masked because it may contain credentials or stream tokens."
Preset="Preset"
PresetLowLatency="Low Latency (0 ms / 1 frame)"
PresetBalanced="Balanced (80 ms / 2 frames)"
PresetStable="Stable (250 ms / 4 frames)"
PresetCustom="Custom"
Latency="Custom Jitter Buffer"
MaxBuffers="Custom Frame Queue"
MaxBuffersHelp="Maximum decoded video frames allowed in the GStreamer appsink queue. Old frames are discarded when the queue is full."
Reconnect="Reconnect Base Delay"
ReconnectHelp="Initial delay used for automatic reconnects. Repeated failures back off automatically and stop increasing at 10 seconds. A successful video frame resets the backoff."
TcpTimestamp="Timestamp TCP packets on receipt"
TcpTimestampHelp="Recommended for live RTSP over TCP. Helps prevent receiver-side latency from drifting upward during long sessions."
PreferHardwareDecode="Prefer hardware decoding"
PreferHardwareDecodeHelp="Allows GStreamer to use available hardware decoders; final selection follows GStreamer plugin ranking and is shown in live status. If a hardware decoder fails during startup, the plugin retries with software decoding. Turn this off to force software decoding."
EnableAudio="Enable Audio"
EnableAudioHelp="Turns RTSP audio decoding on or off. When off, the audio branch is not created and the source is marked audio-inactive in OBS."
AudioMode="Audio Mode"
AudioModeLowLatency="Low Latency"
AudioModeSynchronized="Synchronized"
AudioModeHelp="Low Latency timestamps audio at delivery time and drops stale buffers. Synchronized uses the RTSP audio/video PTS relationship when available while still preventing an unbounded queue."
AudioDelay="Audio Delay"
AudioDelayHelp="Manual audio timing adjustment. Negative values advance audio; positive values delay it."
ShowAdvanced="Show Advanced Settings"
ShowAdvancedHelp="Shows transport and reconnect controls. Leave these hidden unless you need to customize or troubleshoot a particular RTSP source."
RefreshStatus="Refresh Stats"
ResetStats="Reset Stats"
ReconnectNow="Reconnect Now"
CopyDiagnostics="Copy Diagnostics"
NoSignalDisplay="No Signal Display"
NoSignalDisplayHelp="Controls what OBS shows when the RTSP source has no current video frame. Transparent preserves the v0.3.6 behavior. Black outputs an opaque black frame. Reconnecting and No Signal output a black slate with centered status text."
NoSignalTransparent="Transparent"
NoSignalBlack="Black"
NoSignalReconnecting="Reconnecting..."
NoSignalText="No Signal"
