name: Windows Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read plugin version
        id: version
        shell: pwsh
        run: |
          $buildspec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $version = [string]$buildspec.version
          if (-not $version) {
            throw 'buildspec.json does not contain a version.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          $paths = @(
            'scripts\Install-Plugin.ps1',
            'scripts\Install-Release.ps1',
            'data\updater\Install-Update.ps1'
          )

          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $path."
            }
          }

      - name: Install GStreamer 1.28.7 development package
        shell: pwsh
        run: |
          $url = 'https://gstreamer.freedesktop.org/data/pkg/windows/1.28.7/msvc/gstreamer-1.0-msvc-x86_64-1.28.7.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'gstreamer-1.28.7.exe'
          $root = Join-Path $env:RUNNER_TEMP 'gstreamer\1.0\msvc_x86_64'

          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process -FilePath $installer -PassThru -ArgumentList @(
            '/TYPE=devel',
            '/CURRENTUSER',
            '/VERYSILENT',
            '/NORESTART',
            "/DIR=$root"
          )

          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'GStreamer installer timed out after 3 minutes.'
          }

          $installerExit = $process.ExitCode
          if ($installerExit -notin @(0, 3010)) {
            throw "GStreamer installer exited with code $installerExit."
          }

          if (-not (Test-Path (Join-Path $root 'bin\gst-launch-1.0.exe'))) {
            throw 'GStreamer installation did not produce gst-launch-1.0.exe.'
          }

          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'gstreamer-runtime\1.0\msvc_x86_64'
          $runtimeProcess = Start-Process -FilePath $installer -PassThru -ArgumentList @(
            '/TYPE=runtime',
            '/CURRENTUSER',
            '/VERYSILENT',
            '/NORESTART',
            "/DIR=$runtimeRoot"
          )

          if (-not $runtimeProcess.WaitForExit(180000)) {
            Stop-Process -Id $runtimeProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'GStreamer runtime installer timed out after 3 minutes.'
          }

          $runtimeExit = $runtimeProcess.ExitCode
          if ($runtimeExit -notin @(0, 3010)) {
            throw "GStreamer runtime installer exited with code $runtimeExit."
          }

          if (-not (Test-Path (Join-Path $runtimeRoot 'bin\gstreamer-1.0-0.dll'))) {
            throw 'Private GStreamer runtime did not produce gstreamer-1.0-0.dll.'
          }

          "GSTREAMER_BUNDLED_RUNTIME_ROOT=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build plugin
        shell: pwsh
        run: |
          .\scripts\Build-Windows.ps1 -GStreamerRoot $env:GSTREAMER_1_0_ROOT_MSVC_X86_64

      - name: Stage private GStreamer runtime
        shell: pwsh
        run: |
          $source = $env:GSTREAMER_BUNDLED_RUNTIME_ROOT
          $dest = Join-Path (Resolve-Path 'dist') 'runtime'

          if (-not $source -or -not (Test-Path $source)) {
            throw 'Bundled GStreamer runtime source was not found.'
          }

          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item (Join-Path $source '*') $dest -Recurse -Force

          $core = Join-Path $dest 'bin\gstreamer-1.0-0.dll'
          $plugins = Join-Path $dest 'lib\gstreamer-1.0'
          if (-not (Test-Path $core) -or -not (Test-Path $plugins)) {
            throw 'Staged GStreamer runtime is incomplete.'
          }

      - name: Package Windows release
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'release-package'
          $pluginRoot = Join-Path $packageRoot 'low-latency-rtsp'
          $binRoot = Join-Path $pluginRoot 'bin\64bit'
          $localeRoot = Join-Path $pluginRoot 'data\locale'
          $updaterRoot = Join-Path $pluginRoot 'data\updater'

          New-Item -ItemType Directory -Path $binRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $localeRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $updaterRoot -Force | Out-Null

          Copy-Item 'dist\low-latency-rtsp.dll' (Join-Path $binRoot 'low-latency-rtsp.dll') -Force
          Copy-Item 'data\locale\en-US.ini' (Join-Path $localeRoot 'en-US.ini') -Force
          Copy-Item 'data\updater\Install-Update.ps1' (Join-Path $updaterRoot 'Install-Update.ps1') -Force
          Copy-Item 'dist\runtime' $pluginRoot -Recurse -Force
          Copy-Item 'scripts\Install-Release.ps1' (Join-Path $packageRoot 'Install-Release.ps1') -Force
          Copy-Item 'README.md' (Join-Path $packageRoot 'README.md') -Force
          Copy-Item 'LICENSE' (Join-Path $packageRoot 'LICENSE') -Force
          Copy-Item 'LICENSE-NOTICE.txt' (Join-Path $packageRoot 'LICENSE-NOTICE.txt') -Force

          $zipName = "low-latency-rtsp-v$version-windows-x64.zip"
          $zipPath = Join-Path (Resolve-Path 'dist') $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$zipPath.sha256"
          "$hash  $zipName" | Set-Content -Path $checksumPath -Encoding ASCII

          "zip=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc."
          }

          & $iscc "/DMyAppVersion=$version" 'installer\LowLatencyRTSP.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler exited with code $LASTEXITCODE."
          }

          $installerName = "Low-Latency-RTSP-Setup-v$version.exe"
          $installerPath = Join-Path (Resolve-Path 'dist') $installerName
          if (-not (Test-Path $installerPath)) {
            throw "Installer was not created at $installerPath."
          }

          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$installerPath.sha256"
          "$hash  $installerName" | Set-Content -Path $checksumPath -Encoding ASCII

          "exe=$installerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload pull request build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: low-latency-rtsp-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.installer.outputs.exe }}
            ${{ steps.installer.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $stableInstallerName = 'Low-Latency-RTSP-Setup.exe'
          $stableChecksumName = "$stableInstallerName.sha256"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # Keep the stable /latest/download installer URL working without
            # replacing the versioned assets of an already-published tag.
            $existingDir = Join-Path $env:RUNNER_TEMP 'existing-release-assets'
            New-Item -ItemType Directory -Path $existingDir -Force | Out-Null

            $versionedInstallerName = "Low-Latency-RTSP-Setup-v$version.exe"
            gh release download $tag `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $versionedInstallerName `
              --dir $existingDir

            if ($LASTEXITCODE -ne 0) {
              throw "Could not download $versionedInstallerName from existing release $tag."
            }

            $versionedInstaller = Join-Path $existingDir $versionedInstallerName
            if (-not (Test-Path $versionedInstaller)) {
              throw "Existing release installer was not found at $versionedInstaller."
            }

            $stableInstaller = Join-Path $existingDir $stableInstallerName
            $stableChecksum = Join-Path $existingDir $stableChecksumName
            Copy-Item $versionedInstaller $stableInstaller -Force

            $hash = (Get-FileHash $stableInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $stableInstallerName" | Set-Content -Path $stableChecksum -Encoding ASCII

            gh release upload $tag `
              $stableInstaller `
              $stableChecksum `
              --repo $env:GITHUB_REPOSITORY `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Could not refresh stable installer assets on release $tag."
            }

            Write-Host "Release $tag already exists; refreshed stable installer aliases only."
            exit 0
          }

          $stableDir = Join-Path $env:RUNNER_TEMP 'stable-release-assets'
          New-Item -ItemType Directory -Path $stableDir -Force | Out-Null

          $stableInstaller = Join-Path $stableDir $stableInstallerName
          $stableChecksum = Join-Path $stableDir $stableChecksumName
          Copy-Item '${{ steps.installer.outputs.exe }}' $stableInstaller -Force

          $hash = (Get-FileHash $stableInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $stableInstallerName" | Set-Content -Path $stableChecksum -Encoding ASCII

          gh release create $tag `
            '${{ steps.package.outputs.zip }}' `
            '${{ steps.package.outputs.checksum }}' `
            '${{ steps.installer.outputs.exe }}' `
            '${{ steps.installer.outputs.checksum }}' `
            $stableInstaller `
            $stableChecksum `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Low Latency RTSP $tag" `
            --generate-notes
